<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ SYNC INFRATECH</title>
  <link rel="icon" href="data:,">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Exo 2', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { width: 100%; max-width: 500px; padding: 20px; }
    .card {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #00c6ff;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
    }
    .logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #00c6ff, #0099ff);
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }
    h1 { font-size: 28px; margin-bottom: 10px; }
    .subtitle { color: #00c6ff; margin-bottom: 30px; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #00c6ff;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    input::placeholder { color: #888; }
    input:focus, select:focus { outline: none; border-color: #00ffff; background: rgba(0, 198, 255, 0.1); }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c6ff, #0099ff);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: linear-gradient(135deg, #00ffff, #00aaff); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ff6b6b; margin-top: 10px; font-size: 12px; }
    .success { color: #51cf66; margin-top: 10px; font-size: 12px; }
    .hidden { display: none; }
    .loader {
      border: 3px solid #00c6ff;
      border-top: 3px solid transparent;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .dashboard { text-align: left; }
    .dashboard h2 { margin-top: 20px; margin-bottom: 15px; color: #00c6ff; }
    .user-info { background: rgba(0, 198, 255, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .user-info p { margin: 5px 0; font-size: 14px; }
    .logout-btn { background: #ff6b6b; margin-top: 20px; }
    .logout-btn:hover { background: #ff5252; }
  </style>
</head>
<body>
  <!-- LOGIN PAGE -->
  <div id="login-page" class="container">
    <div class="card">
      <div class="logo">⚡</div>
      <h1>SYNC INFRATECH</h1>
      <p class="subtitle">PCM v3.0 · Acesso ao Sistema</p>

      <div id="login-form">
        <input type="email" id="email" placeholder="E-mail" value="c0699118@vale.com">
        <input type="password" id="password" placeholder="Senha" value="SyncLTE@2026">
        <button onclick="fazerLogin()">🔓 Entrar</button>
        <div id="login-error" class="error hidden"></div>
      </div>

      <div id="loading" class="hidden">
        <div class="loader"></div>
        <p>Autenticando...</p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-page" class="container hidden">
    <div class="card dashboard">
      <h1>SYNC INFRATECH</h1>
      <div class="user-info">
        <p><strong>👤 Usuário:</strong> <span id="user-name">-</span></p>
        <p><strong>📧 E-mail:</strong> <span id="user-email">-</span></p>
        <p><strong>👔 Perfil:</strong> <span id="user-perfil">-</span></p>
        <p><strong>🏢 Grupo:</strong> <span id="user-grupo">-</span></p>
      </div>
      <h2>✨ Bem-vindo!</h2>
      <p>Você está autenticado no sistema SYNC INFRATECH.</p>
      <button class="logout-btn" onclick="fazerLogout()">🚪 Sair</button>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: 'AIzaSyDr3KzCbLuLq8K61ANZHHVpjHJ6pQslQes',
      projectId: 'sync-infratech',
      authDomain: 'sync-infratech.firebaseapp.com',
      databaseURL: 'https://sync-infratech.firebaseio.com',
      storageBucket: 'sync-infratech.appspot.com',
      messagingSenderId: '952965577906',
      appId: '1:952965577906:web:36653796bad7a14f6b5dab'
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Login function
    async function fazerLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginError = document.getElementById('login-error');
      const loginForm = document.getElementById('login-form');
      const loading = document.getElementById('loading');

      if (!email || !password) {
        loginError.textContent = '⚠️ Preencha e-mail e senha';
        loginError.classList.remove('hidden');
        return;
      }

      loginForm.classList.add('hidden');
      loading.classList.remove('hidden');
      loginError.classList.add('hidden');

      try {
        // Authenticate
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        // Get user data from Firestore
        const userDoc = await db.collection('users').doc(uid).get();
        if (!userDoc.exists) throw new Error('Usuário não encontrado no banco de dados');

        const userData = userDoc.data();
        if (!userData.ativo) throw new Error('Usuário inativo');

        // Show dashboard
        document.getElementById('user-name').textContent = userData.nome || '—';
        document.getElementById('user-email').textContent = userData.email || '—';
        document.getElementById('user-perfil').textContent = userData.perfil || '—';
        document.getElementById('user-grupo').textContent = userData.grupo || '—';

        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('dashboard-page').classList.remove('hidden');

      } catch (error) {
        console.error('Erro:', error);
        loginError.textContent = '❌ ' + (error.message || 'Erro ao autenticar');
        loginError.classList.remove('hidden');
        loginForm.classList.remove('hidden');
        loading.classList.add('hidden');
      }
    }

    // Logout function
    function fazerLogout() {
      auth.signOut().then(() => {
        document.getElementById('login-page').classList.remove('hidden');
        document.getElementById('dashboard-page').classList.add('hidden');
        document.getElementById('email').value = 'c0699118@vale.com';
        document.getElementById('password').value = 'SyncLTE@2026';
      });
    }

    // Check if already logged in
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists && userDoc.data().ativo) {
          const userData = userDoc.data();
          document.getElementById('user-name').textContent = userData.nome || '—';
          document.getElementById('user-email').textContent = userData.email || '—';
          document.getElementById('user-perfil').textContent = userData.perfil || '—';
          document.getElementById('user-grupo').textContent = userData.grupo || '—';
          document.getElementById('login-page').classList.add('hidden');
          document.getElementById('dashboard-page').classList.remove('hidden');
        }
      }
    });

    // Allow Enter key to login
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fazerLogin();
    });
  </script>
</body>
</html>
